        const inl = /^(.*\S)\s+(\d+(?:[.,]\d+)?)\s*(?:FTE)?$/i.exec(l);
        if (inl && num(inl[2]) <= 1 && card.share == null) { card.share = num(inl[2]); l = inl[1]; }
        const m = NUM_ONLY.exec(l);
        if (m) { const v = num(m[1]); if (v <= 1 && card.share == null) card.share = v; else if (!card.badge) card.badge = { value: v, color: null, raw: l }; else sc.issues.push(`Непонятное число «${l}» в блоке «${card.roleText}»`); continue; }
        if (TAG_WORDS[tight(l)] && !card.tag) { card.tag = TAG_WORDS[tight(l)]; continue; }
        rest.push(l);
      }
      card.textLines = rest;
      sc.persons.push(card);
    } else {
      let type = null, fte = null; const nameParts = [];
      for (const l of lines) {
        if (!type && TEAM_LABEL[tight(l)]) { type = TEAM_LABEL[tight(l)]; continue; }
        const m = FTE_LINE.exec(l); if (m && fte == null) { fte = num(m[1]); continue; }
        nameParts.push(l);
      }
      card.type = type; card.fte = fte; card.name = nameParts.join(' ').trim(); card.teamId = c.teamId || ([...c.inner].find(x => x.teamId) || {}).teamId || '';
      card.hatched = [c, ...c.inner].some(x => HATCH.has(String(x.st.fillStyle || '').toLowerCase()));
      if (!card.name) sc.issues.push(`Блок команды без названия (${card.levelName})`);
      if (fte == null) sc.issues.push(`У команды «${card.name || '?'}» на схеме не найдено «N FTE»`);
      sc.teams.push(card);
    }
    sc.cards.push(card);
  }
  // Связи
  const cardOf = new Map();
  for (const card of sc.cards) { cardOf.set(card.cell.id, card); for (const x of card.cell.inner) if (!cardOf.has(x.id)) cardOf.set(x.id, card); }
  const cardAt = pt => { if (!pt) return null; let best = null; for (const card of sc.cards) if (inRect(pt, card.rect) && (!best || card.rect.w * card.rect.h < best.rect.w * best.rect.h)) best = card; return best; };

    if (!e.edge || hidden(e)) continue;

    if (!sc.adj.has(a.id)) sc.adj.set(a.id, new Set()); if (!sc.adj.has(b.id)) sc.adj.set(b.id, new Set());
    sc.adj.get(a.id).add(b.id); sc.adj.get(b.id).add(a.id);
  }
  sc.cardById = new Map(sc.cards.map(c => [c.id, c]));
  sc.summary = parseSummary(V);
  if (!sc.streams.length) sc.issues.push('Не найдено ни одного свимлайна «Стрим …»');
  return sc;
}

function parseSummary(V) {
  const has = (c, re) => re.test(c.lines.join(' '));
  // Вариант 1: HTML-таблица в одной ячейке
  for (const c of V) {
    if (!/<table/i.test(c.label) || !/численность\s*кп/i.test(c.text)) continue;
    const d = new DOMParser().parseFromString('<!doctype html><body>' + c.label + '</body>', 'text/html');
    const rows = [...d.querySelectorAll('tr')].map(tr => [...tr.children].map(td => td.textContent.replace(/\s+/g, ' ').trim()));
    const hr = rows.find(r => r.some(x => /^факт/i.test(x)));
    if (!hr) continue;
    const fi = hr.findIndex(x => /^факт/i.test(x)), li = hr.findIndex(x => /лимит/i.test(x));
    const get = re => { const r = rows.find(r => re.test(r[0] || '')); return r ? { fact: num(r[fi]), limit: li >= 0 ? num(r[li]) : NaN } : null; };
    return { total: get(/численность\s*кп/i), staff: get(/из\s*них\s*штат/i), vendor: get(/из\s*них\s*вендор/i) };
  }
  // Вариант 2: отдельные ячейки
  const smallest = re => V.filter(c => has(c, re)).sort((a, b) => a.area - b.area)[0];
  const lTotal = smallest(/численность\s*кп/i); if (!lTotal) return null;
  const dist = c => Math.abs(c.rect.y - lTotal.rect.y) + Math.abs(c.rect.x - lTotal.rect.x);
  const hFact = V.filter(c => c.lines.length && /^факт/i.test(c.lines[0])).sort((a, b) => dist(a) - dist(b))[0];
  const hLim = V.filter(c => has(c, /лимит/i)).sort((a, b) => dist(a) - dist(b))[0];
  const val = (row, hdr) => {
    if (!row || !hdr) return NaN;
    const x = V.find(c => c !== row && c !== hdr && c.lines.length === 1 && NUM_ONLY.test(c.lines[0]) && (() => { const p = ctr(c); return p.y >= row.rect.y - 1 && p.y <= row.rect.y + row.rect.h + 1 && p.x >= hdr.rect.x - 1 && p.x <= hdr.rect.x + hdr.rect.w + 1; })());
    return x ? num(NUM_ONLY.exec(x.lines[0])[1]) : NaN;
  };
  const near = re => V.filter(c => has(c, re) && c.area < lTotal.area * 4 && Math.abs(c.rect.x - lTotal.rect.x) < 20 && c.rect.y > lTotal.rect.y && c.rect.y - lTotal.rect.y < 200).sort((a, b) => a.rect.y - b.rect.y)[0];
  const rowOf = l => l ? { fact: val(l, hFact), limit: val(l, hLim) } : null;
  return { total: rowOf(lTotal), staff: rowOf(near(/из\s*них\s*штат/i)), vendor: rowOf(near(/из\s*них\s*вендор/i)) };
}

/* =========================================================
   Схема из PowerPoint (.pptx): фигуры, коннекторы, метки
   ========================================================= */
const EMU = 9525;
const PP_TAGS = { 'биз': 'Биз', 'цк': 'ЦК', 'sfa': 'SFA', 'ит': 'ИТ', 'ит/вен': 'ИТ/Вен', 'вен': 'Вен', 'биз/вен': 'Биз/Вен', 'ит/биз': 'ИТ/Биз' };
const ppTag = s => PP_TAGS[norm(s).replace(/\s+/g, '')] || null;

function ppText(el) {
  const tx = kids(el, 'txBody')[0]; if (!tx) return '';
  const paras = [];
  for (const p of kids(tx, 'p')) {
    let s = '';
    for (const r of p.children) {
      const n = r.localName;
      if (n === 'r' || n === 'fld') { const t = kids(r, 't')[0]; if (t) s += t.textContent; }
      else if (n === 'br') s += '\n';
    }
    paras.push(s);
  }
  return paras.join('\n').replace(/\u000b/g, '\n').replace(/ /g, ' ');
}
function ppFill(spPr) {
  if (!spPr) return { fill: null, grad: false, patt: false };
  const sf = kids(spPr, 'solidFill')[0];
  let fill = null;
  if (sf) { const c = kids(sf, 'srgbClr')[0]; if (c) fill = '#' + c.getAttribute('val'); else { const s = kids(sf, 'schemeClr')[0]; if (s) fill = 'scheme:' + s.getAttribute('val'); } }
  return { fill, grad: !!kids(spPr, 'gradFill')[0], patt: !!kids(spPr, 'pattFill')[0], none: !!kids(spPr, 'noFill')[0] };
}
function ppLine(spPr) {
  const ln = spPr ? kids(spPr, 'ln')[0] : null; if (!ln) return { color: null, dash: null, none: false };
  const sf = kids(ln, 'solidFill')[0]; const c = sf ? kids(sf, 'srgbClr')[0] : null;
  const d = kids(ln, 'prstDash')[0];
  return { color: c ? '#' + c.getAttribute('val') : null, dash: d ? d.getAttribute('val') : null, none: !!kids(ln, 'noFill')[0] };
}

async function readPptx(z, fileName) {
  const slides = z.names.filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n));
  if (!slides.length) throw new Error('В презентации нет слайдов');
  let best = null;
  for (const n of slides) {
    const x = new TextDecoder('utf-8').decode(await z.read(n));
    const cnt = (x.match(/<p:sp>/g) || []).length + (x.match(/<p:sp /g) || []).length;
    if (!best || cnt > best.cnt) best = { n, x, cnt };
  }
  const doc = parseXml(best.x);
  const spTree = byTag(doc, 'spTree')[0];
  const shapes = [], cxns = [], tables = [], groups = [];
  const walk = (el, tf, grpPath) => {
    for (const ch of el.children) {
      const ln = ch.localName;
      if (!['sp', 'cxnSp', 'grpSp', 'graphicFrame', 'pic'].includes(ln)) continue;
      const nv = byTag(ch, 'cNvPr')[0]; const id = nv ? nv.getAttribute('id') : '';
      const prName = ln === 'grpSp' ? 'grpSpPr' : 'spPr';
      const pr = kids(ch, prName)[0];
      const xfrm = ln === 'graphicFrame' ? kids(ch, 'xfrm')[0] : (pr ? kids(pr, 'xfrm')[0] : null);
      let r = null;
      if (xfrm) {
        const off = kids(xfrm, 'off')[0], ext = kids(xfrm, 'ext')[0];
        if (off && ext) {
          const x = +off.getAttribute('x'), y = +off.getAttribute('y'), w = +ext.getAttribute('cx'), h = +ext.getAttribute('cy');
          r = { x: tf.ox + (x - tf.cx) * tf.sx, y: tf.oy + (y - tf.cy) * tf.sy, w: w * tf.sx, h: h * tf.sy };
        }
      }
      if (ln === 'grpSp') {
        const off = xfrm && kids(xfrm, 'off')[0], ext = xfrm && kids(xfrm, 'ext')[0], cho = xfrm && kids(xfrm, 'chOff')[0], che = xfrm && kids(xfrm, 'chExt')[0];
        let ntf = tf;
        if (off && ext && cho && che && r) {
          const cw = +che.getAttribute('cx') || 1, chh = +che.getAttribute('cy') || 1;
          ntf = { ox: r.x, oy: r.y, cx: +cho.getAttribute('x'), cy: +cho.getAttribute('y'), sx: r.w / cw, sy: r.h / chh };
        }
        const g = { id, rect: r, members: [] }; groups.push(g);
        walk(ch, ntf, [...grpPath, g]);
        continue;
      }
      if (!r) continue;
      const rect = { x: r.x / EMU, y: r.y / EMU, w: r.w / EMU, h: r.h / EMU };
      if (ln === 'cxnSp') {
        const st = byTag(ch, 'stCxn')[0], en = byTag(ch, 'endCxn')[0];
        cxns.push({ id, a: st ? st.getAttribute('id') : null, b: en ? en.getAttribute('id') : null });
        continue;
      }
      if (ln === 'graphicFrame') {
        const tbl = byTag(ch, 'tbl')[0];
        if (tbl) tables.push({ id, rect, rows: byTag(tbl, 'tr').map(tr => kids(tr, 'tc').map(tc => ppText(tc).replace(/\s+/g, ' ').trim())) });
        continue;
      }
      if (ln === 'pic') continue;
      const geom = pr ? kids(pr, 'prstGeom')[0] : null;
      const text = ppText(ch);
      const s = { id, rect, text, lines: text.split('\n').map(x => x.replace(/\s+/g, ' ').trim()).filter(Boolean), geom: geom ? geom.getAttribute('prst') : '', ...ppFill(pr), line: ppLine(pr), groups: grpPath };
      for (const g of grpPath) g.members.push(s);
      shapes.push(s);
    }
  };
  walk(spTree, { ox: 0, oy: 0, cx: 0, cy: 0, sx: 1, sy: 1 }, []);
  return analyzePptx({ shapes, cxns, tables, groups, fileName, slide: best.n });
}

const ppCenter = r => ({ x: r.x + r.w / 2, y: r.y + r.h / 2 });
const ppIn = (p, r, tol = 2) => p.x >= r.x - tol && p.x <= r.x + r.w + tol && p.y >= r.y - tol && p.y <= r.y + r.h + tol;
const PP_NUM = /^\d+(?:[.,]\d+)?$/;
const PP_FTE = /^(.*?)\s*(\d+(?:[.,]\d+)?)\s*FTE\s*$/i;


const WB = '(?=$|[^a-zа-яё0-9])';
const RX = src => new RegExp(src.replace(/\\b/g, WB), 'i');
const PP_RULES = [
  [RX('^(?:stream\\s*lead|лидер\\s+стрима)\\b\\s*(.*)$'), 'SL'],
  [RX('^(?:cjo|customer\\s+journey\\s+owner)\\b\\s*(.*)$'), 'CJO'],
  [RX('^(?:cdpo)\\b\\s*(.*)$'), 'OWN', 'CDPO'],
  [RX('^(?:cpo|chief\\s+product\\s+owner)\\b\\s*(.*)$'), 'CPO'],
  [RX('^(?:po\\s*crm|product\\s*owner\\s*crm)\\b\\s*(.*)$'), 'POCRM'],
  [RX('^(?:product\\s*owner\\s*(?:\\(\\s*po\\s*\\))?|po)\\b\\s*(.*)$'), 'PO'],
  [RX('^ит[\\s-]*лидер\\b\\s*(.*)$'), 'ITL'],
  [RX('^процессный\\s+лидер\\b\\s*(.*)$'), 'PL'],
  [RX('^лидер\\s+функци[йияю]\\b\\s*(.*)$'), 'FL'],
  [RX('^бизнес[\\s-]*эксперт\\b\\s*(.*)$'), 'BE'],
  [RX('^лидер\\s+(.+)$'), 'FL'],
  [RX('^ит[\\s-]*команда\\b\\s*(.*)$'), 'TEAM', null, 'IT'],
  [RX('^(?:эксперты|бизнес[\\s-]*команда)\\b\\s*(.*)$'), 'TEAM', null, 'EXP'],
  [RX('^команда\\b\\s*(.*)$'), 'TEAM', null, ''],
];
function ppRole(lines) {
  const tryLine = (l0, used) => {
    const L = l0.replace(/[Сс](?=PO(?:$|[^A-Za-z]))/, 'C').replace(/\s+/g, ' ').trim();
    for (const [re, kind, roleText, type] of PP_RULES) {
      const m = re.exec(L);
      if (m) return { kind, rest: (m[1] || '').trim(), used, roleText: roleText || undefined, type: type == null ? undefined : type };
    }
    return null;
  };
  const l0 = lines[0] || '';
  if (/-$/.test(l0) && lines[1]) { const r = tryLine(l0 + lines[1], 2); if (r) return r; }
  const r1 = tryLine(l0, 1);
  if (r1 && !(r1.kind === 'FL' && !r1.rest && lines[1])) {
    // «Product» / «Owner (PO)» на двух строках
    if (lines[1] && /^owner/i.test(lines[1]) && /^product$/i.test(l0.trim())) { const r = tryLine(l0 + ' ' + lines[1], 2); if (r) return r; }
    return r1;
  }
  if (lines[1]) { const r = tryLine(l0 + ' ' + lines[1], 2); if (r) return r; }
  return r1;
}
// «Название»Фамилия Имя → две строки
const splitQuoted = l => { const m = /^(.*?«[^»]*»)\s*(.+)$/.exec(l); return m && /[A-Za-zА-Яа-яЁё]/.test(m[2]) ? [m[1], m[2]] : [l]; };
const unq = s => String(s || '').replace(/[«»"“”„]/g, '').replace(/\s+/g, ' ').trim();

function analyzePptx({ shapes, cxns, tables, groups, fileName, slide }) {
  const sc = { fileName, pageName: slide.replace(/^ppt\/slides\//, ''), pageCount: 1, streams: [], functions: [], shared: [], cards: [], persons: [], teams: [], summary: null, issues: [], adj: new Map(), objectName: '', isPptx: true };
  // Легенда: группы с подписями о нормах управляемости
  const legendRects = groups.filter(g => g.rect && g.members.some(s => /нормам\s+управляемости|спорный\s+(cpo|po)|малая\s+численность/i.test(s.text))).map(g => ({ x: g.rect.x / EMU, y: g.rect.y / EMU, w: g.rect.w / EMU, h: g.rect.h / EMU }));
  const inLegend = s => /нормам\s+управляемости|^спорный\s|малая\s+численность/i.test(s.text) || legendRects.some(r => ppIn(ppCenter(s.rect), r, 1));

  const title = live.filter(s => s.lines.length === 1 && /^кп\s+\S/i.test(s.lines[0]) && s.lines[0].length < 80).sort((a, b) => a.rect.y - b.rect.y)[0];
  if (title) sc.objectName = title.lines[0].replace(/^кп\s+/i, '').trim();
  // Метки и бейджи
  const small = s => s.rect.w < 75 && s.rect.h < 26;
  const tags = [], badges = [], blocks = [], frames = [], labels = [];
  for (const s of live) {
    const t = s.lines.join(' ');
    if (!t) {
      const red = colorClass(s.line.color) === 'red' || (s.fill && colorClass(s.fill) === 'red' && s.line.color && colorClass(s.line.color) === 'red');
      if (red && s.rect.w >= 90 && s.rect.h >= 70) frames.push({ shape: s, rect: s.rect, value: null, id: s.id });
      continue;
    }
    if (small(s) && ppTag(t)) { tags.push({ s, tag: ppTag(t) }); continue; }
    if (small(s) && PP_NUM.test(t.replace(/\s+/g, ''))) { badges.push({ s, value: num(t.replace(/\s+/g, '')), color: colorClass(s.fill) }); continue; }
    if (/^совместное\s+исп/i.test(t)) { labels.push(s); continue; }
    if (s === title) continue;
    const role = ppRole(s.lines);
    if (role) blocks.push({ s, role });
  }
  // Рамки совместного использования: подпись внутри рамки
  for (const lb of labels) {
    const m = /(\d+(?:[.,]\d+)?)\s*FTE/i.exec(lb.text);
    let fr = frames.filter(f => ppIn(ppCenter(lb.rect), f.rect)).sort((a, b) => a.rect.w * a.rect.h - b.rect.w * b.rect.h)[0];
    if (!fr) { fr = { shape: lb, rect: lb.rect, value: null, id: lb.id, labelOnly: true }; frames.push(fr); }
    fr.value = m ? num(m[1]) : null; fr.raw = lb.lines.join(' ');

  }

    const s = b.s, r = b.role;

    const card = { id: 'pp' + s.id, shapeId: s.id, rect: s.rect, cx: ppCenter(s.rect).x, cy: ppCenter(s.rect).y, idx: shapes.indexOf(s), tags: [] };
    if (r.kind === 'TEAM') {
      card.cls = 'team'; card.type = r.type || null; let fte = null; const nameParts = [];
      for (let l of rest) { const m = PP_FTE.exec(l); if (m && fte == null) { fte = num(m[2]); l = m[1]; } if (l.trim()) nameParts.push(unq(l)); }
      card.fte = fte; card.name = nameParts.join(' ').trim(); card.hatched = !!s.patt;
      sc.teams.push(card);
    } else {
      card.cls = 'person'; card.kind = r.kind; card.roleText = r.roleText || KIND_TITLE[r.kind];
      let share = null; const out = [];
      for (let l of rest) {
        const m = PP_FTE.exec(l); if (m && share == null) { share = num(m[2]); l = m[1]; }
        l = l.trim(); if (l) out.push(l);
      }
      card.share = share;
      // направление/подпись: в кавычках или в первой строке после роли
      const q = out.findIndex(l => /[«"]/.test(l));
      card.dirHint = r.rest ? unq(r.rest) : (q >= 0 ? unq(out[q]) : (r.kind === 'CPO' || r.kind === 'PO' || r.kind === 'POCRM') && out.length > 1 ? unq(out[0]) : '');
      card.textLines = out.map(unq);
      if (r.kind === 'FL') card.funcName = r.rest ? unq(r.rest) : (q >= 0 ? unq(out[q]) : '');
      if (r.kind === 'SL') { const qm = /«([^»]+)»/.exec(out.join(' ')); const sm = /стрим\S*\s+(.+)$/i.exec(out[0] || ''); card.streamName = qm ? unq(qm[1]) : r.rest ? unq(r.rest) : (sm ? unq(sm[1]) : ''); card.textLines = card.textLines.map(l => l.replace(/^стрим\S*\s+/i, '')); }
      if (r.kind === 'OWN' && !r.roleText) card.roleText = s.lines[0];
      sc.persons.push(card);
    }
    sc.cards.push(card); cardOfShape.set(s.id, card);
  }
  // Неизвестные блоки с ФИО и долей — свои блоки
  for (const s of live) {
    if (cardOfShape.has(s.id) || !s.lines.length || small(s) || s === title || labels.includes(s)) continue;
    if (s.lines.length < 2) continue;
    const last = s.lines.join(' ');
    if (!/\d+(?:[.,]\d+)?\s*FTE\s*$/i.test(last)) continue;
    if (/участник|штат\s*fte|вендор/i.test(last)) continue;
    const out = []; let share = null;
    for (let l of s.lines.slice(1)) { const m = PP_FTE.exec(l); if (m && share == null) { share = num(m[2]); l = m[1]; } if (l.trim()) out.push(unq(l)); }
    const card = { id: 'pp' + s.id, shapeId: s.id, rect: s.rect, cx: ppCenter(s.rect).x, cy: ppCenter(s.rect).y, idx: shapes.indexOf(s), tags: [], cls: 'person', kind: 'OWN', roleText: s.lines[0], share, textLines: out, dirHint: '' };
    sc.persons.push(card); sc.cards.push(card); cardOfShape.set(s.id, card);
  }
  // Метки и бейджи → в ближайшую карточку, внутри которой они лежат
  const holder = p => { let best = null; for (const c of sc.cards) if (ppIn(p, c.rect, 3) && (!best || c.rect.w * c.rect.h < best.rect.w * best.rect.h)) best = c; return best; };
  for (const t of tags) { const c = holder(ppCenter(t.s.rect)); if (c) { c.tags.push(t.tag); cardOfShape.set(t.s.id, c); } }
  for (const b of badges) { const c = holder(ppCenter(b.s.rect)); if (c && !c.badge) { c.badge = { value: b.value, color: b.color, raw: b.s.text }; cardOfShape.set(b.s.id, c); } }
  for (const c of sc.cards) {
    const bl = c.tags.find(t => ['Биз', 'ЦК', 'SFA'].includes(t));
    c.tag = bl || c.tags[0] || null;
    if (c.cls === 'team' && !c.type) c.type = c.tags.some(t => /ИТ/.test(t)) ? 'IT' : c.tags.some(t => /Биз/.test(t)) ? 'EXP' : null;

    if (gPO.length) rows.push({ lead: [], groups: gPO.map(b => ({ po: b, teams: [] })) });
    const lane = { lv, kind: 'stream', title: 'Стрим ' + s.name, stream: s, rows, frame, funcs, marks: [] };
    if (!noSc && (s.added || (!s.src && !s.slKey))) lane.marks.push({ t: 'добавить', cls: 'add', tip: 'Стрима не было на схеме' });
    else if (S.sc && s.src && s.orig && s.orig !== s.name) lane.marks.push({ t: 'название', cls: 'chg', tip: MARK['название'].tip, old: s.orig, now: s.name });
    if (!persons('SL', lv).length && !vacRoles('SL', lv).length) lane.noSL = true;
    V.levels.push(lane);
  }
  // Удалённые со структуры команды AP — на месте блока схемы
  for (const T of R.teams.values()) {
    if (!T.del) continue;
    const lvs = T.dlv.length ? T.dlv : [];
    for (const lv of lvs) { const L = V.levels.find(x => x.lv === lv); if (!L) continue; const b = teamBlock(T, lv, true); L.rows[0].groups.push({ po: null, teams: [b] }); }
  }
  for (const x of R.noAP) if (x.del) { /* уже размещены выше вместе с остальными блоками без AP */ }
  // Строки AP без команды (обычно вакансии) — лоток над схемой, команду выбирают в панели
  V.noTeam = [];
  for (const e of R.E) if (!e.r.teamKey && (e.st === 'noteam' || e.st === 'out' || e.assigned)) {
    const r = e.r;
    const b = reg({ key: 'NT:' + e.rowKey, type: 'noteam', rk: e.rowKey, lv: UNIT, title: r.isVac ? 'Вакансия' : 'Без команды в AP', area: r.isVac ? (r.position || '') : '', who: r.isVac ? (r.shd ? 'ИД ШД ' + r.shd : '—') : fioOf(e.pk), share: e.share / 100, out: e.st === 'out', asg: e.assigned ? e.tk : null, marks: [], notes: [] });
    if (e.kind) b.notes.push(e.kind.toLowerCase());
    if (e.assigned) { const T = R.teams.get(e.tk); const asPO = [...R.po.values()].some(i => i.tk === e.tk && i.sel && i.sel.t === 'p' && i.sel.k === e.pk); b.notes.push('→ «' + (T ? T.label : '?') + '»' + (asPO ? ' · PO' : '')); }
    if (e.st === 'noteam') { b.marks.push({ t: 'команда', cls: 'need', tip: 'Строка AP без команды — выберите команду или «не учитывать»' }); V.need.push({ key: b.key, lv: UNIT }); }
    V.noTeam.push(b);
  }
  // Заголовки функций — для панели «Функция»
  for (const L of V.levels) for (const f of L.funcs) V.blocks.set('FN:' + f.fid + '@' + L.lv, { key: 'FN:' + f.fid + '@' + L.lv, type: 'func', fid: f.fid, lv: L.lv, title: f.name, marks: [], notes: [] });
  // Нерешённое
  for (const L of V.levels) {
    L.need = 0;
    const seenK = new Set();
    const walk = b => { if (b && !seenK.has(b.key) && b.marks && b.marks.some(mm => mm.cls === 'need')) { seenK.add(b.key); L.need++; V.need.push({ key: b.key, lv: L.lv }); } };
    for (const r of L.rows) { r.lead.forEach(walk); for (const g of [...(r.under || []), ...r.groups]) { walk(g.po); g.teams.forEach(walk); } }
    if (L.frame) for (const g of L.frame.groups) { walk(g.po); g.teams.forEach(walk); }
    for (const f of L.funcs) { f.leaders.forEach(walk); for (const g of f.groups) { walk(g.po); g.teams.forEach(walk); } }
    L.fte = L.kind === 'unit' ? C.unit.cjoBadge : (C.streams.get(L.lv)?.slBadge || 0);
  }
  V.need = uniq(V.need.map(x => x.key)).map(k => ({ key: k, lv: V.need.find(x => x.key === k).lv }));
  R.V = V;
  return V;
}

/* =========================================================
   Шаг 6 «Список изменений»: разделы «Для администратора AP» и «Для поддержки Jira».

const REPORT_INTRO = 'Прошу внести изменения в AP по списку ниже. Указаны только изменения — всё остальное у сотрудника остаётся без изменений.';
const lines = arr => uniq(arr.filter(x => x && x !== '—'));

const PART_G = new Set(['poExt', 'move']);
const partItem = d => PART_G.has(d.g) || (d.g === 'rest' && String(d.key).startsWith('rest|'));
function partLines(R, pk) {
  const vs = R.virt.filter(v => v.pk === pk && v.tk && ['moveIn', 'moveOut', 'rest', 'xpo', 'xpoOut'].includes(v.virtual));
  const tks = new Set(vs.map(v => v.tk)); if (!tks.size) return null;
  const T = tk => R.teams.get(tk);
  const lvOf = (tk, lv) => T(tk) && T(tk).lv.length > 1 && lv ? lv : '';
  const line = (tk, lv, sh, role) => `${T(tk)?.name || tk} — ${fmtPct(sh)}${lv ? ' · ' + R.lvName(lv) : ''}${role ? ', роль «' + roleName(role) + '»' : ''}`;
  const sortK = x => (T(x.tk)?.name || '') + '|' + x.lv;
  const asIs = R.E.filter(e => e.pk === pk && e.tk && tks.has(e.tk) && e.st !== 'del').map(e => ({ tk: e.tk, lv: lvOf(e.tk, e.lv), sh: e.share }));
  const m = new Map();
  for (const e of [...R.E.filter(e => e.pk === pk && e.tk && tks.has(e.tk) && e.st !== 'del'), ...vs]) {
    const k = e.tk + '|' + lvOf(e.tk, e.lv) + '|' + (e.virtual === 'xpo' ? e.role : '');

// Часть 1: строки из черновика. name — главное (ФИО, вакансия, команда), ids — вспомогательное (ТН, ИД ШД, TEAM_ID)
function reportRows(R) {

    const links = uniq(J.rows.filter(r => r.teamActive).map(r => r.empId + '|' + r.teamId)).length, arch = uniq(J.rows.filter(r => !r.teamActive).map(r => r.empId + '|' + r.teamId)).length;
    jRight = [ckOk('Выгрузка принята'), h('div', { class: 'small' }, `Лист «${J.sheet}» · строк: ${J.raw.length} · объект: ${uniq(J.rows.map(r => r.obj).filter(Boolean)).join(', ') || 'n/d'} · команд: ${uniq(J.rows.map(r => r.teamId)).length} · сотрудников: ${uniq(J.rows.map(r => r.empId)).length} · связок «работает»: ${links} · «архив»: ${arch}`)];
  }
  if (J && !J.err) jRight.push(h('details', { open: S.open && S.open.jcols }, h('summary', { class: 'linkbtn small', onclick: () => { S.open = S.open || {}; S.open.jcols = !S.open.jcols; } }, `Какие столбцы взяты · ${Object.keys(J.colIdx).length} из ${Object.keys(JIRA_FIELDS).length}`),
    h('table', { style: 'margin-top:6px' }, h('tr', null, h('th', null, 'Поле'), h('th', null, 'Столбец в файле')), Object.entries(JIRA_FIELDS).map(([f, d]) => h('tr', null, h('td', null, d.name, d.req ? h('span', { class: 'err' }, ' *') : null), h('td', null, jiraColSelect(f)))))));
  // Справочник ролей
  const d = S.dict;
  const dLeft = [h('h3', null, 'Справочник ролей'),
    h('div', { class: 'muted small' }, '.xlsx, .xls или .csv · столбец с названиями ролей'),
    h('div', { class: 'fileline' }, fileBtn('Выбрать файл', '.xlsx,.xls,.csv,.txt,.xml,.htm,.html', f => loadFile('dict', f)), d ? h('button', { class: 'linkbtn xs', type: 'button', onclick: () => dropFile('dict') }, 'убрать') : null),
    d ? h('div', { class: 'fname' }, (d.ok ? '✓ ' : '✗ ') + d.fileName) : null,
    dateLine('dict', D)];
  let dRight;
  if (S.dictErr) dRight = [h('div', { class: 'errbox', style: 'margin:0' }, h('b', null, 'Файл не принят: '), S.dictErr)];
  else if (!d) dRight = [none('Без него закрыт шаг «Сверка ролей», и роли нельзя менять: ни по справочнику, ни по схеме, ни при выборе PO.')];
  else if (!d.ok) dRight = ckBlock(d.ck, 'шаг «Сверка ролей» закрыт, роли нельзя менять.');
  else dRight = [ckOk('Справочник принят'), h('div', { class: 'fileline small', style: 'margin:0' }, 'Столбец с ролями: ', h('select', { onchange: e => { S.m.dictCol = e.target.value; saveManual(); prepDict(); recompute(); render(); } }, d.headers.map(x => h('option', { value: x, selected: x === d.col }, x)))),
    h('div', { class: 'small' }, `Ролей: ${d.names.length}` + (d.dups ? ` · повторов: ${d.dups}` : '') + (d.empty ? ` · пустых строк: ${d.empty}` : '') + (S.apData ? ` · ролей AP в справочнике: ${uniq(S.apData.rows.map(r => key(r.roleRaw)).filter(Boolean)).filter(k => d.roles.has(k)).length} из ${uniq(S.apData.rows.map(r => key(r.roleRaw)).filter(Boolean)).length}` : ''))];
  return h('main', { class: 'wrap' },
    h('div', { class: 'card' }, h('h2', null, 'Файлы'),
      h('p', { class: 'muted', style: 'margin:0 0 12px' }, 'Загрузите все файлы, какие есть. Файл со сбоями не принимается — исправьте его и загрузите заново: инструмент работает только с чистыми данными.'),
      fileRow(apLeft, apRight), fileRow(scLeft, scRight), fileRow(dLeft, dRight), fileRow(jLeft, jRight),
      h('div', { class: 'info soft', style: 'margin:12px 0 0' }, 'Рекомендуем загружать выгрузки одной даты. Синхронизация AP → Jira может занимать до суток, поэтому свежие изменения из AP могут ещё не отразиться в Jira — такие расхождения проверьте повторной выгрузкой Jira.')),
    S.idx ? draftPanel() : null, footer(null, S.idx ? (S.dict && S.dict.ok ? 1 : 2) : null));
}

/* =========================================================
   Проект: файлы + решения. Автосохранение в браузере (IndexedDB),
   восстановление после перезагрузки, файл проекта, «Очистить всё»
   ========================================================= */
const TOOL_VERSION = 'v3.6', PROJECT_FORMAT = 1;
const IDB_NAME = 'sverka-struktury', IDB_STORE = 'project', IDB_KEY = 'current';
const FILE_KINDS = ['sc', 'ap', 'dict', 'jira']; // порядок восстановления: решения уже на месте
const FILE_LOAD = { sc: f => onSchemaFile(f), ap: f => onAPFile(f), dict: f => onDictFile(f, !!S.restoring), jira: f => onJiraFile(f) };
S.files = {};
S.save = { state: 'empty', at: null, err: '', unsaved: 0, downloaded: '', handle: null, handleName: '' };

/* ---------- IndexedDB ---------- */
function idbOpen() {
  return new Promise((res, rej) => {
    let rq; try { rq = indexedDB.open(IDB_NAME, 1); } catch (e) { rej(e); return; }
    rq.onupgradeneeded = () => rq.result.createObjectStore(IDB_STORE);
    rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error || new Error('IndexedDB недоступна'));
    rq.onblocked = () => rej(new Error('хранилище занято другой вкладкой'));
  });
}
async function idbDo(mode, fn) {
  const db = await idbOpen();
  try {
    return await new Promise((res, rej) => {
      const tx = db.transaction(IDB_STORE, mode), st = tx.objectStore(IDB_STORE); let out;
      const rq = fn(st); if (rq) rq.onsuccess = () => { out = rq.result; };
      tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error || new Error('ошибка записи')); tx.onabort = () => rej(tx.error || new Error('запись прервана'));
    });
  } finally { db.close(); }
}
const idbGet = () => idbDo('readonly', st => st.get(IDB_KEY));
const idbPut = v => idbDo('readwrite', st => st.put(v, IDB_KEY));
const idbDel = () => idbDo('readwrite', st => st.delete(IDB_KEY));

/* ---------- файлы ---------- */
// Каждый загруженный файл запоминается целиком (байты), чтобы восстановить проект как будто файлы загрузили заново
async function loadFile(kind, file) {
  const bytes = await file.arrayBuffer();
  S.files[kind] = { name: file.name, lastModified: file.lastModified || Date.now(), bytes };
  await FILE_LOAD[kind](new File([bytes], file.name, { lastModified: S.files[kind].lastModified }));
  scheduleSave();
}
function dropFile(kind) {
  delete S.files[kind];
  if (kind === 'sc') { dropSchema(); } else { if (kind === 'jira') S.jira = null; if (kind === 'dict') S.dict = null; recompute(); render(); }
  scheduleSave();
}
const hasProject = () => FILE_KINDS.some(k => S.files[k]);

/* ---------- автосохранение ---------- */
let saveTimer = null;
function scheduleSave() {
  if (S.restoring) return;
  clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 350);
}
function projectData() {
  return { app: 'Сверка оргструктуры', kind: 'project', format: PROJECT_FORMAT, toolVersion: TOOL_VERSION, saved: new Date().toISOString(), objectName: (S.R && S.R.objectName) || '', files: S.files, m: S.m };
}
async function saveNow() {
  const sv = S.save;
  if (!hasProject()) { try { await idbDel(); } catch (e) { } sv.state = 'empty'; sv.unsaved = 0; updateSaveUI(); return; }
  if (sv.handle) { // выбран файл для автосохранения (Chrome, Edge)
    try { const w = await sv.handle.createWritable(); await w.write(await projectFileBlob()); await w.close(); sv.state = 'file'; sv.at = new Date(); sv.unsaved = 0; sv.err = ''; updateSaveUI(); return; }
    catch (e) { sv.handle = null; sv.err = 'файл недоступен: ' + (e.message || e); }
  }
  try { await idbPut(projectData()); sv.state = 'ok'; sv.at = new Date(); sv.unsaved = 0; sv.err = ''; }
  catch (e) {
    sv.state = 'fail'; sv.err = (e && (e.message || e.name)) || 'неизвестная ошибка'; sv.unsaved++;
    if (!sv.downloaded) { sv.downloaded = await downloadProject(true); if (sv.downloaded) sv.unsaved = 0; }
  }
  updateSaveUI();
}
window.addEventListener('beforeunload', e => { const sv = S.save; if (sv.state === 'fail' && sv.unsaved > 0) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- файл проекта ---------- */
const b64 = buf => { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => { const bin = atob(s); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; };
async function projectFileBlob() {
  const d = projectData(); const files = {};
  for (const [k, f] of Object.entries(d.files)) files[k] = { name: f.name, lastModified: f.lastModified, b64: b64(f.bytes) };
  return new Blob([JSON.stringify(Object.assign({}, d, { files, m: undefined, decisions: d.m }))], { type: 'application/json' });
}
function projectFileName() {
  const n = new Date(), p = x => String(x).padStart(2, '0');
  const obj = ((S.R && S.R.objectName) || 'проект').replace(/[\\/:*?"<>|]+/g, '_').slice(0, 60);
  return `Сверка — ${obj} — ${p(n.getDate())}.${p(n.getMonth() + 1)}.${n.getFullYear()} ${p(n.getHours())}-${p(n.getMinutes())}.json`;
}
// auto: сохранение сразу после сбоя автосохранения — без вопросов, в «Загрузки»
async function downloadProject(auto) {
  if (!hasProject()) { toast('Сохранять нечего: файлы не загружены'); return ''; }
  const name = projectFileName();
  download(name, await projectFileBlob(), 'application/json');
  if (!auto) { if (S.save.state === 'fail') S.save.unsaved = 0; toast('Проект сохранён в папку «Загрузки»: ' + name); updateSaveUI(); }
  else showModal({ title: 'В браузер сохранить не удалось', text: `Причина: ${S.save.err}. Чтобы работа не потерялась, проект сохранён файлом в папку «Загрузки»: «${name}». Дальше сохраняйте проект кнопкой «Сохранить проект» — на плашке сверху видно, сколько изменений не сохранено. В следующий раз откройте этот файл кнопкой «Открыть проект».`, buttons: [{ label: 'Понятно', primary: true }] });
  return name;
}
async function pickAutoFile() {
  try {
    const handle = await window.showSaveFilePicker({ suggestedName: projectFileName(), types: [{ description: 'Проект сверки', accept: { 'application/json': ['.json'] } }] });
    S.save.handle = handle; S.save.handleName = handle.name || ''; await saveNow();
    toast('Каждое изменение теперь сохраняется в файл «' + S.save.handleName + '»');
  } catch (e) { if (e && e.name !== 'AbortError') toast('Не удалось выбрать файл: ' + (e.message || e)); }
}
// Открыть файл проекта: только проект целиком (файлы + решения)
async function openProjectFile(file) {
  let j;
  try { j = JSON.parse(await file.text()); } catch (e) { showModal({ title: 'Не удалось открыть', text: 'Это не файл проекта сверки.', buttons: [{ label: 'Понятно', primary: true }] }); return; }
  if (!j || j.kind !== 'project') {
    const old = j && (j.decisions || j.v === 3 || j.colmap);
    showModal({ title: 'Не удалось открыть', text: old ? 'В этом файле только решения, без данных. Откройте файл проекта или загрузите файлы заново.' : 'Это не файл проекта сверки.', buttons: [{ label: 'Понятно', primary: true }] });
    return;
  }
  const bad = projectIncompatible(j); if (bad) { showModal({ title: 'Проект из другой версии', text: bad, buttons: [{ label: 'Понятно', primary: true }] }); return; }
  const files = {}; for (const [k, f] of Object.entries(j.files || {})) if (FILE_KINDS.includes(k) && f && f.b64) files[k] = { name: f.name, lastModified: f.lastModified, bytes: unb64(f.b64) };
  const go = () => restoreProject({ files, m: j.decisions || {} }, `Проект открыт: ${file.name}`);
  if (hasProject() || S.idx) {
    const when = j.saved ? new Date(j.saved) : null;
    showModal({ title: 'Заменить текущий проект?', text: `Заменить текущие файлы и решения проектом${j.objectName ? ' «' + j.objectName + '»' : ''}${when ? ' от ' + when.toLocaleString('ru-RU', { dateStyle: 'short', timeStyle: 'short' }) : ''}? Текущий проект можно сначала сохранить.`,
      buttons: [{ label: 'Заменить', primary: true, act: go }, { label: 'Отмена', cancel: true }] });
  } else go();
}
function projectIncompatible(j) {
  if (j.format > PROJECT_FORMAT) return `Проект сохранён в более новой версии инструмента ${j.toolVersion || ''} — откройте его в ней.`;
  if (!(j.format >= 1)) return `Проект сохранён в версии ${j.toolVersion || 'неизвестной'} — откройте его в ней или загрузите файлы заново.`;
  return '';
}
async function restoreProject(p, msg) {
  S.restoring = true;
  try {
    S.files = {}; S.sc = S.scRaw = S.scCk = null; S.scErr = ''; S.scFile = ''; S.ap = S.apData = S.idx = S.apCk = null; S.apErr = ''; S.dict = null; S.dictErr = ''; S.jira = null;
    S.m = mergeManual(p.m || {}); S.sel = null; S.lvSel = 'ALL'; S.undo = S.redo = null;
    for (const k of FILE_KINDS) { const f = p.files && p.files[k]; if (!f) continue; S.files[k] = f; await FILE_LOAD[k](new File([f.bytes], f.name, { lastModified: f.lastModified })); }
  } finally { S.restoring = false; }
  recompute(); render(); if (msg) toast(msg);
  scheduleSave();
}
function clearAll() {
  showModal({ title: 'Очистить всё?', text: 'Удалить из браузера все файлы и решения? Перед этим можно сохранить проект в файл.',
    buttons: [{ label: 'Очистить', primary: true, danger: true, act: async () => { await restoreProject({ files: {}, m: {} }); S.step = 0; try { await idbDel(); } catch (e) { } S.save.state = 'empty'; S.save.unsaved = 0; render({ top: true }); toast('Всё очищено'); } },
      { label: 'Сохранить проект', act: () => downloadProject(false) }, { label: 'Отмена', cancel: true }] });
}
// Восстановление после перезагрузки страницы
async function restoreOnStart() {
  let p = null;
  try { p = await idbGet(); } catch (e) { return; }
  if (!p || !p.files) return;
  const bad = projectIncompatible(p);
  if (bad) { showModal({ title: 'Сохранённый проект из другой версии', text: bad, buttons: [{ label: 'Понятно', primary: true }] }); return; }
  await restoreProject(p, 'Проект восстановлен: файлы и решения на месте');
}

/* ---------- статус и кнопки в шапке ---------- */
// Автосохранение не перерисовывает страницу (иначе сбросятся невыбранные поля): обновляем только надписи статуса;
// полная перерисовка — только когда меняется вид (появилась или ушла красная плашка)
let lastSaveKind = '';
function updateSaveUI() {
  const st = saveStatus(), kind = S.save.state === 'fail' ? 'fail' : 'ok';
  if (kind !== lastSaveKind && !S.restoring) { lastSaveKind = kind; render(); return; }
  const a = document.querySelector('.privacy .svst'); if (a) a.textContent = ' · ' + st.t;
  const p = document.querySelector('.privacy'); if (p) p.classList.toggle('bad', st.cls === 'bad');
  const k = document.querySelector('.doskeys > span:last-child'); if (k) k.textContent = '■ Офлайн · ' + st.t;
  const sb = document.querySelector('.savebar > span'); if (sb) sb.textContent = ` (${S.save.err}) · несохранённых изменений: ${S.save.unsaved}`;
}
const hm = d => d ? String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') : '';
function saveStatus() {
  const sv = S.save;
  if (sv.state === 'fail') return { cls: 'bad', t: `✗ Автосохранение не работает · несохранённых изменений: ${sv.unsaved}` };
  if (sv.state === 'file') return { cls: 'ok', t: `✓ Автосохранение в файл «${sv.handleName}» ${hm(sv.at)}` };
  if (sv.state === 'ok') return { cls: 'ok', t: '✓ Автосохранение ' + hm(sv.at) };
  return { cls: 'ok', t: 'Автосохранение: нечего сохранять' };
}
function saveBanner() {
  const sv = S.save; if (sv.state !== 'fail') return null;
  return h('div', { class: 'wrap' }, h('div', { class: 'savebar' }, h('b', null, '✗ Автосохранение не работает'), h('span', null, ` (${sv.err}) · несохранённых изменений: ${sv.unsaved}`), h('span', { class: 'grow' }),
    h('button', { class: 'btn sm', type: 'button', onclick: () => downloadProject(false) }, 'Сохранить проект'),
    window.showSaveFilePicker ? h('button', { class: 'btn ghost sm', type: 'button', onclick: pickAutoFile }, 'Сохранять в файл автоматически') : null));
}
function projectLinks() {
  return h('span', { class: 'bk' }, 'Проект: ',
    h('button', { class: 'linkbtn', type: 'button', title: 'Файлы и решения одним файлом — в папку «Загрузки»', onclick: () => downloadProject(false) }, 'сохранить'), ' · ',
    h('label', { class: 'linkbtn', title: 'Открыть файл проекта (.json)' }, 'открыть', h('input', { type: 'file', accept: '.json,application/json', hidden: true, onchange: e => { const f = e.target.files[0]; e.target.value = ''; if (f) openProjectFile(f); } })), ' · ',
    h('button', { class: 'linkbtn', type: 'button', onclick: clearAll }, 'очистить всё'));
}

/* ---------- модальное окно ---------- */
function showModal(o) { S.modal = o; render(); requestAnimationFrame(() => { const b = document.querySelector('.modal .btn.primary, .modal .btn'); if (b) b.focus(); }); }
function closeModal() { S.modal = null; render(); }
function modalEl() {
  const o = S.modal; if (!o) return null;
  const run = b => () => { closeModal(); if (b.act) b.act(); };
  return h('div', { class: 'modalbg' + (o.dos || dosOn() ? ' dos' : ''), role: 'presentation' },
    h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': o.title },
      o.title ? h('div', { class: 'modal-t' }, h('span', null, o.title)) : null,
      h('div', { class: 'modal-b' }, o.text),
      h('div', { class: 'modal-a' }, (o.buttons || []).map(b => h('button', { class: 'btn' + (b.primary ? ' primary' : ' ghost') + (b.danger ? ' danger' : ''), type: 'button', onclick: run(b) }, b.label)))));
}
document.addEventListener('keydown', e => {
  if (!S.modal || e.key !== 'Escape') return;
  const c = (S.modal.buttons || []).find(b => b.cancel); if (c) { e.preventDefault(); closeModal(); }
});

/* ---------- тема MS-DOS (только шаг «Файлы»): строка клавиш и клавиши ---------- */
function dosKeys() {
  if (!dosOn()) return null;
  const st = saveStatus();
  return h('div', { class: 'doskeys noprint' },
    h('span', null, h('b', null, 'F1'), ' Помощь'), h('span', null, h('b', null, 'F2'), ' Сохранить проект'), h('span', null, h('b', null, 'F3'), ' Открыть проект'),
    h('span', null, h('b', null, 'F8'), ' Очистить всё'), h('span', null, h('b', null, 'Tab'), ' Следующее поле'), h('span', { class: 'grow' }),
    h('span', { class: st.cls === 'bad' ? 'bad' : '' }, '■ Офлайн · ' + st.t));
}
document.addEventListener('keydown', e => {
  if (!dosOn() || S.modal || !/^F(1|2|3|8)$/.test(e.key) || e.ctrlKey || e.metaKey || e.altKey) return;
  e.preventDefault();
  if (e.key === 'F1') showModal({ text: 'Бог в помощь!', buttons: [{ label: 'Аминь', primary: true }], dos: true });
  else if (e.key === 'F2') downloadProject(false);
  else if (e.key === 'F3') { const i = document.querySelector('header .bk input[type=file]'); if (i) i.click(); }
  else if (e.key === 'F8') clearAll();
});

/* =========================================================
   Запуск
   ========================================================= */
window.addEventListener('error', e => { try { toast('Ошибка: ' + (e.message || 'неизвестно')); } catch (x) { } });
window.addEventListener('unhandledrejection', e => { try { toast('Ошибка: ' + ((e.reason && e.reason.message) || 'неизвестно')); } catch (x) { } });
recompute(); render();
restoreOnStart();

</script>
</body>
